[module]
name = "tstk"
version = "0.1.0"
description = "A toolkit for time series decomposition, forecasting, and visualization"
authors = ["Joshua Marie"]
license = "MIT"
r_version = "^4.1.0"

[package_deps]
tseries = "*"
forecast = "*"
prophet = "*"
ggplot2 = ">=3.4.0"
dplyr = ">=1.1.0"
lubridate = "*"
purrr = "*"
slider = "*"
stringr = "*"
glue = "*"
rlang = "*"
tidyr = "*"
tsibble = { version = "*", repo = "https://tidyverts.r-universe.dev/" }
feasts = { version = "*", repo = "https://tidyverts.r-universe.dev/" }
fable = { version = "*", repo = "https://tidyverts.r-universe.dev/" }

[test]
framework = "testthat"
dir = "tests"
